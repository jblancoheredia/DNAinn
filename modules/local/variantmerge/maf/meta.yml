name: variantmerge_maf
description: Convert a tiered variant table into a polished clinical-team MAF-like TSV.
keywords:
  - maf
  - clinical
  - variant
  - report
input:
  - meta:
      type: map
      description: Sample metadata map, usually containing id.
  - tier_tsv:
      type: file
      description: Tiered variant TSV from VARIANTMERGE_TIER (high_confidence, review, or single_caller).
      pattern: "*.merged_variants.*.tsv"
output:
  - clinical_maf_tsv:
      type: file
      description: Polished clinical MAF-like variant table.
      pattern: "*.clinical_maf.tsv"
  - versions:
      type: file
      description: Software versions file.
      pattern: "versions.yml"
authors:
  - "local"
