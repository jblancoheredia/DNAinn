name: variantmerge_tier
description: Tier merged cfDNA caller calls using hotspot, germline, and noise evidence into HIGH_CONFIDENCE / SINGLE_CALLER / REVIEW / LIKELY_NOISE.
keywords:
  - tier
  - noise
  - filter
  - cfdna
  - clinical
  - hotspot
  - germline
input:
  - meta:
      type: map
      description: Sample metadata map, usually containing id.
  - merged_tsv:
      type: file
      description: Unified merged variant TSV from VARIANTMERGE_TSV.
      pattern: "*.merged_variants.tsv"
  - hotspots:
      type: file
      description: hg38 hotspot list (MAF-style tab-delimited) from params.hotspots.
      pattern: "*.tsv"
output:
  - tiered_tsv:
      type: file
      description: Full input table annotated with tier, germline, and hotspot columns.
      pattern: "*.merged_variants.tiered.tsv"
  - high_confidence_tsv:
      type: file
      description: HIGH_CONFIDENCE rows only.
      pattern: "*.merged_variants.high_confidence.tsv"
  - review_tsv:
      type: file
      description: REVIEW rows only.
      pattern: "*.merged_variants.review.tsv"
  - single_caller_tsv:
      type: file
      description: SINGLE_CALLER rows only.
      pattern: "*.merged_variants.single_caller.tsv"
  - likely_noise_tsv:
      type: file
      description: LIKELY_NOISE rows only.
      pattern: "*.merged_variants.likely_noise.tsv"
  - versions:
      type: file
      description: Software versions file.
      pattern: "versions.yml"
authors:
  - "local"
